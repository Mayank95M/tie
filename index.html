<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an instrument console. A narrow rail of tabs on the left, one working surface on the right.
   The heat on the page image is the only loud colour; everything else stays quiet. */
:root {
  --bg: #e8edeb;
  --panel: #ffffff;
  --panel-2: #f2f5f4;
  --ink: #14211f;
  --ink-2: #44524f;
  --muted: #6d7b78;
  --line: #d2dad7;
  --line-2: #e3e9e7;
  --accent: #0d5c6a;
  --accent-2: #0a4853;
  --accent-ink: #ffffff;
  --accent-soft: #d6eaed;
  --focus: #2a78d6;
  --good: #1d7a3b;
  --warn: #9a5a00;
  --bad: #b5312f;
  --bad-soft: #f7dfde;
  --warn-soft: #f6ead2;
  --good-soft: #dcefe2;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;
  --s7: #4a3aa7;
  --s8: #e34948;
  --page: #ffffff;
  --shadow: 0 1px 2px rgba(20, 33, 31, .06), 0 6px 18px rgba(20, 33, 31, .06);
  --display: "Chakra Petch", "Bahnschrift", "DIN Alternate", "Arial Narrow", system-ui, sans-serif;
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1314; --panel: #131c1e; --panel-2: #182326; --ink: #e1eaea; --ink-2: #b2c1c0; --muted: #869794;
    --line: #283639; --line-2: #1f2b2e; --accent: #5cbccb; --accent-2: #7fd0dc; --accent-ink: #062327; --accent-soft: #143a40;
    --focus: #6aa8f0; --good: #4cc274; --warn: #e2a73d; --bad: #ef7472; --bad-soft: #3d1f1f; --warn-soft: #3a2e17; --good-soft: #17331f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --page: #fbfcfb; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1314; --panel: #131c1e; --panel-2: #182326; --ink: #e1eaea; --ink-2: #b2c1c0; --muted: #869794;
  --line: #283639; --line-2: #1f2b2e; --accent: #5cbccb; --accent-2: #7fd0dc; --accent-ink: #062327; --accent-soft: #143a40;
  --focus: #6aa8f0; --good: #4cc274; --warn: #e2a73d; --bad: #ef7472; --bad-soft: #3d1f1f; --warn-soft: #3a2e17; --good-soft: #17331f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --page: #fbfcfb; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- frame ---------- */
.app { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.mark { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.mark b { font: 600 26px/1 var(--display); letter-spacing: .08em; color: var(--ink); }
.mark span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); font-size: 13px; white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.chip.example .dot { background: var(--warn); }
.chip.live .dot { background: var(--good); }
.shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 0; }
.rail { position: sticky; top: 57px; align-self: start; padding: 18px 12px 24px 16px; display: flex; flex-direction: column; gap: 2px;
  max-height: calc(100vh - 57px); overflow: auto; }
.rail .grp { font: 500 11px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 16px 10px 6px; }
.rail .grp:first-child { padding-top: 4px; }
.rail button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
  padding: 8px 10px; border-radius: 6px; color: var(--ink-2); }
.rail button:hover { background: var(--panel-2); color: var(--ink); }
.rail button[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); font-weight: 700; }
.rail button svg { width: 16px; height: 16px; flex: none; opacity: .8; }
main { min-width: 0; padding: 20px 24px 64px; }
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; max-width: 1400px; }
.vhead { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 20px; }
.vhead h1 { font: 600 24px/1.15 var(--display); letter-spacing: .02em; }
.vhead p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.vhead .act { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- surfaces ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel > h2, .ph { font: 600 15px/1.3 var(--sans); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.panel > h2 .muted { font-weight: 400; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }
.wide2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.notice { border-radius: 8px; padding: 10px 14px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 14px; }
.notice.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--ink); }
.notice.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); color: var(--ink); }
.notice.good { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 35%, transparent); color: var(--ink); }
.example-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 14px; border-radius: 8px;
  background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.example-bar p { margin: 0; flex: 1 1 320px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.quiet:hover { background: var(--panel-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 15px; height: 15px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--panel-2); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tog { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); cursor: pointer; font-size: 13px; color: var(--ink-2); }
.tog[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.tog .sw { width: 9px; height: 9px; border-radius: 50%; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); min-width: 0; }
label.f > span { font-weight: 700; color: var(--ink); }
.inp, select.inp, textarea.inp { width: 100%; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); min-width: 0; }
textarea.inp { min-height: 90px; resize: vertical; font-family: var(--mono); font-size: 13px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.hint { font-size: 13px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* ---------- tables ---------- */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.tw.tall { max-height: 560px; overflow-y: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
table.t th { font-weight: 700; color: var(--ink-2); background: var(--panel-2); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
table.t th.sortable { cursor: pointer; }
table.t th.sortable:hover { color: var(--ink); }
table.t td.n, table.t th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.off td { color: var(--muted); text-decoration: line-through; }
table.t select.inp { padding: 3px 6px; font-size: 13px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); border-color: transparent; }
.pill.warn { background: var(--warn-soft); border-color: transparent; }
.pill.bad { background: var(--bad-soft); border-color: transparent; }
.gdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* ---------- heat viewer ---------- */
.hv { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start; }
.hv .ctl { position: sticky; top: 76px; display: grid; gap: 14px; }
.ctl .panel { padding: 14px; }
.ctl .grpl { font: 500 11px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.stage-top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
.stage-top h2 { font: 600 17px/1.3 var(--sans); }
.viewport { position: relative; overflow: auto; max-height: 78vh; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line-2);
  touch-action: pan-x pan-y; }
.viewport.drawing { cursor: crosshair; }
.paper { position: relative; margin: 18px auto 18px 48px; box-shadow: var(--shadow); background: var(--page); }
.paper canvas { display: block; }
.ruler { position: absolute; left: -38px; top: 0; bottom: 0; width: 34px; font: 10px/1 var(--mono); color: var(--muted); }
.ruler i { position: absolute; right: 0; width: 6px; border-top: 1px solid var(--muted); }
.ruler span { position: absolute; right: 9px; transform: translateY(-50%); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.ramp { width: 160px; height: 10px; border-radius: 3px; }
.tip { position: fixed; z-index: 60; pointer-events: none; max-width: 300px; background: var(--ink); color: var(--panel);
  padding: 7px 10px; border-radius: 6px; font-size: 13px; line-height: 1.4; box-shadow: var(--shadow); }
.tip b { font-weight: 700; }
.zoom { display: inline-flex; gap: 2px; margin-left: auto; }

/* ---------- charts ---------- */
.chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart .ax { stroke: var(--line); }
.chart .grid { stroke: var(--line-2); }
.chart text { fill: var(--ink-2); font: 12px var(--sans); }
.chart text.v { fill: var(--ink); font-family: var(--mono); font-size: 11.5px; }
.chart text.lab { fill: var(--ink); }
.ckey { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin: 4px 0 8px; }
.ckey i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* ---------- write-up ---------- */
.prose { max-width: 75ch; font-size: 15.5px; line-height: 1.65; }
.prose h3 { font: 600 16px/1.3 var(--sans); margin: 18px 0 6px; }
.prose p { margin: 0 0 12px; }
.prose ul { margin: 0 0 12px; padding-left: 20px; }
.prose .cap { font-size: 14px; color: var(--ink-2); }
.code { font: 12px/1.5 var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  overflow: auto; max-height: 240px; white-space: pre; }
.steps { counter-reset: s; display: grid; gap: 14px; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.step::before { counter-increment: s; content: counter(s); font: 600 15px/30px var(--display); width: 30px; height: 30px; text-align: center;
  border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); }
.step h3 { font: 700 15px/1.4 var(--sans); margin: 4px 0 4px; }
.step p { margin: 0 0 8px; color: var(--ink-2); }
.copyrow { display: flex; gap: 6px; align-items: center; min-width: 0; }
.copyrow .inp { font-family: var(--mono); font-size: 13px; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--ink-2); background: var(--panel-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80;
  background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 8px; box-shadow: var(--shadow); font-size: 14px; max-width: calc(100vw - 32px); }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: var(--bad-soft); }
details.more > summary { cursor: pointer; color: var(--accent); font-size: 14px; }
details.more[open] > summary { margin-bottom: 10px; }
.empty { padding: 26px; text-align: center; color: var(--ink-2); }
.stat-row { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.stat-row div { display: grid; }
.stat-row b { font: 600 20px/1.2 var(--sans); }
.stat-row span { font-size: 12.5px; color: var(--muted); }

@media (max-width: 1100px) {
  .hv { grid-template-columns: minmax(0, 1fr); }
  .hv .ctl { position: static; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: 53px; z-index: 20; flex-direction: row; overflow-x: auto; max-height: none; padding: 8px 16px;
    background: var(--bg); border-bottom: 1px solid var(--line); gap: 4px; }
  .rail .grp { display: none; }
  .rail button { width: auto; white-space: nowrap; padding: 6px 10px; }
  .rail button[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--accent); }
  main { padding: 16px 16px 56px; }
  .grid2, .grid3, .wide2 { grid-template-columns: minmax(0, 1fr); }
  .top { padding: 8px 16px; }
  .mark span { display: none; }
  .paper { margin-left: 44px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark"><b>TIE</b><span>Tracking Interaction Events · cursor, clicks and attention on ReMeDe</span></div>
    <div class="status" id="status"></div>
  </header>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <main id="main"><div class="empty">Loading TIE…</div></main>
  </div>
</div>
<div id="tip" class="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* ---- util.js ---- */
/* ============================ utilities ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const PROPS = new Set(['value', 'checked', 'selected', 'disabled', 'indeterminate', 'multiple', 'open', 'hidden']);
function h(tag, attrs, ...kids) {
  const svgTags = /^(svg|g|path|rect|circle|line|polyline|polygon|text|tspan|defs|clipPath|title|linearGradient|stop)$/;
  const el = svgTags.test(tag) ? document.createElementNS('http://www.w3.org/2000/svg', tag) : document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.setAttribute('class', v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (PROPS.has(k) && !(el instanceof SVGElement)) el[k] = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  addKids(el, kids);
  return el;
}
function addKids(el, kids) {
  for (const k of [kids].flat(Infinity)) {
    if (k == null || k === false || k === true) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function debounce(fn, ms) { let t = 0; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* number formats */
const fmt = {
  n(v, d = 0) { if (v == null || !isFinite(v)) return '–'; return Number(v).toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d }); },
  s(v) { if (v == null || !isFinite(v)) return '–'; return v >= 100 ? fmt.n(v, 0) : v >= 10 ? fmt.n(v, 1) : fmt.n(v, 1); },
  pct(v, d = 0) { return v == null || !isFinite(v) ? '–' : fmt.n(v * 100, d) + '%'; },
  p(p) { if (p == null || !isFinite(p)) return '–'; if (p < 0.001) return '< .001'; return '= ' + p.toFixed(3).replace(/^0/, ''); },

/* larger data in IndexedDB (its own database name, so other tools on the same site cannot clash) */
const idb = {
  db: null,
  async open() {
    if (this.db) return this.db;
    if (!window.indexedDB) return null;
    try {
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open('tie-dashboard', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      });
    } catch (e) { this.db = null; }
    return this.db;
  },
  async get(k) {
    const db = await this.open(); if (!db) return null;
    return new Promise((res) => { try { const rq = db.transaction('kv').objectStore('kv').get(k); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); } catch (e) { res(null); } });
  },
  async set(k, v) {
    const db = await this.open(); if (!db) return false;
    return new Promise((res) => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } });
  },
  async del(k) {
    const db = await this.open(); if (!db) return;
    return new Promise((res) => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); } });
  },
};

/* toast */
let toastTimer = 0;

  let el = $('#toast');
  if (!el) { el = h('div', { id: 'toast', class: 'toast', role: 'status' }); document.body.append(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms);

/* saving files: the claude.ai viewer's downloads capability when present, a normal download elsewhere */
const downloadsCap = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
const insideViewer = !!(window.claude && typeof window.claude.use === 'function');
async function saveFile(name, data, type) {
  const cap = await Promise.race([downloadsCap, sleep(insideViewer ? 1500 : 0).then(() => null)]);
  if (cap) {
    try { await cap.save({ filename: name, data }); toast('Saved ' + name); return true; }
    catch (e) {
      if (e && e.code === 'declined') { toast('Not saved.'); return false; }
      if (e && e.code === 'rate_limited') { toast('Another save is waiting for your answer.'); return false; }
      if (e && e.code === 'rejected_extension') { toast('This kind of file cannot be saved here.'); return false; }
    }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
    const a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    if (insideViewer) toast('If nothing was saved, open TIE from your own site to save files.', 5200);
    return true;
  } catch (e) { toast('Could not save: ' + e.message, 5000); return false; }
}
async function copyText(text, html) {
  try {
    if (html && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);
        toast('Copied with formatting'); return true;
      } catch (x) { /* fall back to plain text */ }
    }
    await navigator.clipboard.writeText(text);
    toast(html ? 'Copied as plain text (this view does not allow formatted copying)' : 'Copied');
    return true;
  } catch (e) {
    const ta = h('textarea', { class: 'inp', style: { position: 'fixed', left: '-9999px' } }); ta.value = text;
    document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (x) { }
    ta.remove();
    toast(ok ? 'Copied' : 'Select the text and copy it yourself; this view blocks copying.');
    return ok;
  }
}
function readFile(file, as) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(r.error);
    if (as === 'buffer') r.readAsArrayBuffer(file); else if (as === 'dataurl') r.readAsDataURL(file); else r.readAsText(file);

}
async function gunzipBase64(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return await new Response(stream).text();
}

function vaderRows() {

function parseVader(name, buf, text) {
  // VaDeR exports: the Excel results workbook ("Data" sheet), CSV, or participants' answer files (JSON)

/* ------------------------------------------------------------------ loading data */
async function loadFiles(files) {
  const report = [];
  for (const file of files) {
    const nm = file.name;
    try {
      if (/\.(xlsx|xls|csv)$/i.test(nm)) {
        const v = parseVader(nm, new Uint8Array(await readFile(file, 'buffer')));
        if (!v) { report.push(nm + ': no participant ID column found'); continue; }
        APP.vader = APP.vader.filter((x) => x.name !== nm).concat(v);
        if (APP.project.vaderGroups[nm] == null) APP.project.vaderGroups[nm] = guessGroup(nm);
        report.push(nm + `: ${v.rows.length} VaDeR participants`);
      } else if (/\.json$/i.test(nm)) {
        const text = await readFile(file);
        let obj = null; try { obj = JSON.parse(text); } catch (e) { report.push(nm + ': not valid JSON'); continue; }
        if (obj && obj.format === 'tie-export/1') {
          if (APP.example) clearExample();
          const r = ENG.addExport(APP.store, obj, nm);
          report.push(nm + `: ${r.added} new batches`);
        } else if (obj && obj.format === 'tie-project/1') {
          applyProject(obj); report.push(nm + ': project settings loaded');
        } else {
          const v = parseVader(nm, null, text);
          if (v) { APP.vader = APP.vader.filter((x) => x.name !== nm).concat(v); if (APP.project.vaderGroups[nm] == null) APP.project.vaderGroups[nm] = guessGroup(nm); report.push(nm + `: ${v.rows.length} VaDeR responses`); }
          else report.push(nm + ': not a TIE or VaDeR file');
        }
      } else if (/\.(png|jpe?g|webp)$/i.test(nm)) {
        report.push(nm + ': add screenshots on the Heatmaps tab, under Background');
      } else report.push(nm + ': not a file TIE can read');
    } catch (e) { report.push(nm + ': ' + e.message); }
  }
  rebuild(); projectChanged(); await saveData(); render();
  return report;
}

function heatState() {

    ref: {}, zoom: 1, showAreas: false, res: 'high' }, APP.ui.heat || {});

function defaultPage(opts) {

  return (pick || opts.slice().sort((a, b) => b.views - a.views)[0] || {}).key || '';

function heatData(U) {

  if (APP.cache.has(ck)) return APP.cache.get(ck);
  const pvs = pvsFor(U.page);
  const lays = ENG.layoutsFor(U.page, pvs, APP.store);
  const lay = lays.find((l) => l.cw === U.ref[U.page]) || lays[0];

  let use = pvs;
  if (!U.align && ref) use = pvs.filter(({ S, pv }) => { const sn = ENG.snapAt(S, pv, pv.t + 1, APP.store); return sn && sn.cw === ref.cw; });
  const G = ENG.gather(use, ref, APP.store, { raw: !U.align });

  let H = ref ? ref.dh : 2000;

  const parts = [...best.keys()];

  for (let y = 0; y <= H; y += 8) reach.push({ y, frac: parts.length ? parts.filter((p) => best.get(p) >= y).length / parts.length : 0 });
  const firsts = G.views.map((v) => (v.bands[0] ? v.bands[0].bot : null)).filter((x) => x != null).sort((a, b) => a - b);
  const fold = firsts.length ? firsts[Math.floor(firsts.length / 2)] : 0;
  const matched = ref ? new Set(use.map(({ S, pv }) => { const sn = ENG.snapAt(S, pv, pv.t + 1, APP.store); return sn ? sn.cw : 0; })) : new Set();
  const D = { pvs, use, lays, lay, ref, G, W, H, reach, fold, parts, widths: [...matched].filter(Boolean).sort((a, b) => a - b) };

  const opts = pageOptions();
  const v = h('div', { class: 'view' });
  main.append(v);
  v.append(h('div', { class: 'vhead' }, h('div', null, h('h1', null, 'Heatmaps'),
    h('p', null, 'Where participants moved the cursor, clicked and scrolled on each page, drawn over an outline of the page as they saw it.'))));
  if (APP.example) v.append(exampleBar());
  v.append(filterBar(() => render()));
  if (!opts.length) { v.append(h('div', { class: 'panel empty' }, 'No page views match the current filter.')); return; }
  if (!opts.find((o) => o.key === U.page)) U.page = defaultPage(opts);
  const D = heatData(U);

  /* ---------- controls ---------- */
  const ctl = h('div', { class: 'ctl' });
  const pageSel = h('select', { class: 'inp', id: 'heat-page', 'aria-label': 'Page' },
    opts.map((o) => h('option', { value: o.key, selected: o.key === U.page }, `${o.label.trim()} (${o.parts} ${o.parts === 1 ? 'person' : 'people'}, ${o.views} views)`)));
  pageSel.addEventListener('change', () => { U.page = pageSel.value; saveUi(); render(); });
  const seg = (items, cur, set, label) => h('div', { class: 'seg', role: 'group', 'aria-label': label },
    items.map(([k, t]) => h('button', { 'aria-pressed': String(cur === k), onclick: () => { set(k); saveUi(); draw(); syncSeg(); } }, t)));
  const segs = [];
  const syncSeg = () => segs.forEach((f) => f());
  const mkSeg = (items, get, set, label) => {
    const el = seg(items, get(), set, label);
    segs.push(() => $$('button', el).forEach((b, i) => b.setAttribute('aria-pressed', String(items[i][0] === get()))));
    return el;

  ctl.append(h('div', { class: 'panel stack' },
    h('div', null, h('div', { class: 'grpl' }, 'Page'), pageSel),
    h('div', null, h('div', { class: 'grpl' }, 'Show'), mkSeg([['cursor', 'Cursor'], ['clicks', 'Clicks'], ['reach', 'Scroll reach'], ['areas', 'Sections']], () => U.layer, (k) => { U.layer = k; }, 'Layer'))));

  // background
  const bgFile = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp', hidden: true, id: 'heat-bg-file' });
  bgFile.addEventListener('change', async () => {
    const f = bgFile.files[0]; if (!f) return;
    const url = await readFile(f, 'dataurl');
    await setBackground(U.page, { src: url, opacity: 1, name: f.name });
    U.bg = 'image'; saveUi(); render();
  });
  const bgRec = APP.bgImages[U.page];
  const opacity = h('input', { type: 'range', min: 0.2, max: 1, step: 0.05, value: bgRec ? bgRec.opacity : 1, id: 'heat-bg-op', 'aria-label': 'Screenshot opacity' });
  opacity.addEventListener('input', () => { if (APP.bgImages[U.page]) { APP.bgImages[U.page].opacity = +opacity.value; draw(); } });
  opacity.addEventListener('change', () => persistBackground(U.page));
  ctl.append(h('div', { class: 'panel stack' },
    h('div', null, h('div', { class: 'grpl' }, 'Background'),
      mkSeg([['outline', 'Outline'], ['image', 'Screenshot'], ['none', 'None']], () => U.bg, (k) => { U.bg = k; if (k === 'image' && !APP.bgImages[U.page]) bgFile.click(); }, 'Background')),
    bgFile,
    bgRec ? h('div', { class: 'stack' }, h('label', { class: 'f' }, h('span', null, 'Screenshot opacity'), opacity),
      h('div', { class: 'row' }, h('button', { class: 'btn sm', onclick: () => bgFile.click() }, 'Replace screenshot'),
        h('button', { class: 'btn sm quiet', onclick: async () => { delete APP.bgImages[U.page]; await idb.del('bg:' + U.page); U.bg = 'outline'; saveUi(); render(); } }, 'Remove')))
      : h('p', { class: 'hint' }, 'The outline is drawn from what each participant’s browser recorded. For a figure, add a full-page screenshot taken at ', h('b', null, (D.W || '–') + ' px'), ' wide (in Chrome: DevTools → ⋮ → Run command → “Capture full size screenshot”).')));

  // layout
  const refSel = h('select', { class: 'inp', id: 'heat-ref', 'aria-label': 'Reference width' },
    D.lays.map((l) => h('option', { value: l.cw, selected: D.lay && l.cw === D.lay.cw }, `${l.cw} px wide (${l.views} view${l.views === 1 ? '' : 's'})`)));
  refSel.addEventListener('change', () => { U.ref[U.page] = +refSel.value; saveUi(); render(); });
  const alignBox = h('input', { type: 'checkbox', id: 'heat-align', checked: U.align });
  alignBox.addEventListener('change', () => { U.align = alignBox.checked; saveUi(); render(); });
  ctl.append(h('div', { class: 'panel stack' },
    h('div', { class: 'grpl' }, 'Screen sizes'),
    D.lays.length ? h('label', { class: 'f' }, h('span', null, 'Reference layout'), refSel) : h('p', { class: 'hint' }, 'No page outline was recorded for this page.'),
    h('label', { class: 'row small' }, alignBox, 'Align other screen sizes to it'),
    h('p', { class: 'hint' }, U.align ? `Positions from ${D.widths.length || 1} screen width${D.widths.length === 1 ? '' : 's'} are matched to this layout through the headings and controls on the page.`
      : 'Only page views at exactly this width are shown, without alignment.')));

  // appearance
  const radius = h('input', { type: 'range', min: 10, max: 70, step: 2, value: U.radius, id: 'heat-radius', 'aria-label': 'Spread' });
  const inten = h('input', { type: 'range', min: 0.3, max: 3, step: 0.1, value: U.intensity, id: 'heat-int', 'aria-label': 'Intensity' });
  radius.addEventListener('input', debounce(() => { U.radius = +radius.value; saveUi(); draw(); }, 60));
  inten.addEventListener('input', debounce(() => { U.intensity = +inten.value; saveUi(); draw(); }, 30));
  const dotsBox = h('input', { type: 'checkbox', id: 'heat-dots', checked: U.dots });
  dotsBox.addEventListener('change', () => { U.dots = dotsBox.checked; saveUi(); draw(); });
  const areaBox = h('input', { type: 'checkbox', id: 'heat-areas', checked: U.showAreas });
  areaBox.addEventListener('change', () => { U.showAreas = areaBox.checked; saveUi(); draw(); });
  ctl.append(h('div', { class: 'panel stack' },
    h('div', { class: 'grpl' }, 'Appearance'),
    h('label', { class: 'f' }, h('span', null, 'Spread'), radius),
    h('label', { class: 'f' }, h('span', null, 'Intensity'), inten),
    h('div', { class: 'row' }, h('span', { class: 'small muted' }, 'Colours'), mkSeg([['heat', 'Heat'], ['blue', 'Blue']], () => U.ramp, (k) => { U.ramp = k; }, 'Colours')),
    h('label', { class: 'row small' }, dotsBox, 'Mark each click (Clicks view)'),
    h('label', { class: 'row small' }, areaBox, 'Outline page sections on every view')));

  /* ---------- stage ---------- */
  const stage = h('div', { class: 'stage' });
  const nParts = D.parts.length, nViews = D.G.views.length;
  const cursorSec = D.G.moves.reduce((s, m) => s + m.w, 0);
  const statRow = h('div', { class: 'stat-row' },
    h('div', null, h('b', null, fmt.n(nParts)), h('span', null, nParts === 1 ? 'participant' : 'participants')),
    h('div', null, h('b', null, fmt.n(nViews)), h('span', null, 'page views')),
    h('div', null, h('b', null, fmt.n(cursorSec / 60, 1) + ' min'), h('span', null, 'cursor time')),
    h('div', null, h('b', null, fmt.n(D.G.clicks.length)), h('span', null, 'clicks')));
  const zoomOut = h('button', { class: 'btn sm', 'aria-label': 'Zoom out', onclick: () => { U.zoom = clamp(U.zoom / 1.25, 0.25, 4); saveUi(); draw(); } }, icon('zoomout'));
  const zoomIn = h('button', { class: 'btn sm', 'aria-label': 'Zoom in', onclick: () => { U.zoom = clamp(U.zoom * 1.25, 0.25, 4); saveUi(); draw(); } }, icon('zoomin'));
  const zoomFit = h('button', { class: 'btn sm', onclick: () => { U.zoom = 1; saveUi(); draw(); } }, 'Fit');
  stage.append(h('div', { class: 'stage-top' }, h('h2', null, pageLabel(U.page)), h('div', { class: 'zoom' }, zoomOut, zoomFit, zoomIn)));
  stage.append(statRow);
  const areaBar = h('div', { class: 'row', style: { margin: '10px 0' } });
  stage.append(areaBar);
  const viewport = h('div', { class: 'viewport', id: 'heat-viewport' });
  const paper = h('div', { class: 'paper' });
  const ruler = h('div', { class: 'ruler', 'aria-hidden': 'true' });
  const canvas = h('canvas', { id: 'heat-canvas', role: 'img', 'aria-label': 'Heat map of the selected page' });
  paper.append(ruler, canvas); viewport.append(paper);
  stage.append(viewport);
  const legend = h('div', { class: 'legend' });
  stage.append(legend);
  const notes = h('p', { class: 'hint', style: { margin: '8px 0 0' } });
  stage.append(notes);
  const exportRow = h('div', { class: 'row', style: { marginTop: '12px' } });
  stage.append(exportRow);
  v.append(h('div', { class: 'hv' }, ctl, stage));

  let M = null, scale = 1, areas = [], aStats = [], draft = null, dragFrom = null;
  function layerGrid() {
    if (!D.ref && !D.G.moves.length) return null;
    const key = ['grid', U.layer, U.radius, U.page, filterKey(), U.align, D.W, D.H].join('|');
    if (APP.cache.has(key)) return APP.cache.get(key);
    let g = null;
    if (U.layer === 'cursor' || U.layer === 'areas') g = ENG.heatGrid(D.G.moves, D.W, D.H, 4, U.radius);
    else if (U.layer === 'clicks') g = ENG.heatGrid(D.G.clicks.map((c) => ({ x: c.x, y: c.y, w: 1 })), D.W, D.H, 4, Math.max(10, U.radius * 0.8));
    APP.cache.set(key, g);
    return g;
  }
  function areaLabelsFor() {
    return aStats.map((s) => `${fmt.pct(s.pct)} reached · ${fmt.s(s.vis)} s in view`);
  }
  function draw() {
    areas = areasFor(U.page, D.ref);
    aStats = (U.layer === 'areas' || U.showAreas) && areas.length ? areaSummary(areas, D.G) : [];
    M = {
      W: D.W, H: D.H, ref: D.ref, labels: APP.store.labels, layer: U.layer, grid: U.layer === 'reach' ? null : layerGrid(),
      ramp: U.ramp, intensity: U.intensity, clicks: D.G.clicks, showDots: U.dots, reach: D.reach, nParts, fold: D.fold,
      areas, areaLabels: areaLabelsFor(), showAreas: U.showAreas, selArea: U.selArea, background: U.bg, bg: APP.bgImages[U.page], draft,
    };
    const avail = Math.max(240, viewport.clientWidth - 70);
    scale = Math.min(1, avail / D.W) * U.zoom;
    HV.render(canvas, M, scale);
    // ruler every 500 or 1000 px of page height
    ruler.innerHTML = '';
    const step = D.H > 6000 ? 1000 : 500;
    for (let y = 0; y <= D.H; y += step) {
      ruler.append(h('i', { style: { top: y * scale + 'px' } }), h('span', { style: { top: y * scale + 'px' } }, String(y)));
    }
    // legend
    legend.innerHTML = '';
    if (U.layer === 'cursor' || U.layer === 'clicks' || (U.layer === 'areas')) {
      legend.append(h('span', null, U.layer === 'clicks' ? 'Fewer clicks' : 'Less cursor time'), h('span', { class: 'ramp', style: { background: HV.rampCss(U.ramp) } }),
        h('span', null, U.layer === 'clicks' ? 'more clicks' : 'more'));
      if (U.layer === 'clicks' && U.dots) legend.append(
        h('span', null, h('span', { class: 'gdot', style: { background: '#0d5c6a' } }), 'click on a control'),
        h('span', null, h('span', { class: 'gdot', style: { background: '#c4302b' } }), 'unresponsive click'),
        h('span', null, h('span', { class: 'gdot', style: { background: '#7b8a93' } }), 'click on text or empty space'));
    } else if (U.layer === 'reach') {
      legend.append(h('span', null, 'Darker shading: fewer participants scrolled this far. Lines mark where 75%, 50% and 25% stopped.'));
    }
    notes.textContent = noteText();
    drawAreaBar();
  }
  function noteText() {
    const parts = [];
    if (D.ref && U.align && D.widths.length > 1) parts.push(`Screens from ${D.widths[0]} to ${D.widths[D.widths.length - 1]} px wide were aligned to the ${D.W} px layout.`);
    if (D.G.unmapped) parts.push(`${fmt.n(D.G.unmapped)} positions had no recorded outline and were scaled by width only.`);
    if (U.layer === 'cursor') parts.push('Each cursor position counts for as long as the cursor stayed there (up to 2.5 s). Colours are scaled to the busiest spots on this page.');
    if (U.layer === 'areas' && areas.length) parts.push('Sections come from the page headings. A section counts as reached when it came into view; time in view counts while at least half of it was on screen.');
    return parts.join(' ');
  }
  function drawAreaBar() {
    areaBar.innerHTML = '';
    if (U.layer !== 'areas') { areaBar.hidden = true; return; }
    areaBar.hidden = false;
    const hideBox = h('input', { type: 'checkbox', checked: !APP.project.hideAuto[U.page] });
    hideBox.addEventListener('change', () => { if (hideBox.checked) delete APP.project.hideAuto[U.page]; else APP.project.hideAuto[U.page] = true; projectChanged(); draw(); });
    const drawBtn = h('button', { class: 'btn sm' + (U.drawing ? ' primary' : ''), onclick: () => { U.drawing = !U.drawing; viewport.classList.toggle('drawing', !!U.drawing); drawAreaBar(); } },
      U.drawing ? 'Drag on the page to draw…' : 'Draw a section box');
    areaBar.append(h('label', { class: 'row small' }, hideBox, 'Sections from page headings'), drawBtn,
      h('button', { class: 'btn sm quiet', onclick: () => { APP.tab = 'areas'; APP.ui.areas = Object.assign(APP.ui.areas || {}, { page: U.page }); saveUi(); render(); } }, 'Open the section table'));
  }

  /* hover and drawing */
  const toPage = (e) => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale]; };
  canvas.addEventListener('pointermove', (e) => {
    const [x, y] = toPage(e);
    if (dragFrom) {
      draft = { x: Math.min(dragFrom[0], x), y: Math.min(dragFrom[1], y), w: Math.abs(x - dragFrom[0]), h: Math.abs(y - dragFrom[1]) };
      M.draft = draft; HV.render(canvas, M, scale); return;
    }
    tip.show(hoverText(x, y), e.clientX, e.clientY);
  });
  canvas.addEventListener('pointerleave', () => tip.hide());
  canvas.addEventListener('pointerdown', (e) => {
    if (!U.drawing) {
      const [x, y] = toPage(e);
      const a = areas.find((ar) => x >= ar.x && x <= ar.x + ar.w && y >= ar.y && y <= ar.y + ar.h);
      if (U.layer === 'areas') { U.selArea = a ? a.id : null; draw(); }
      return;
    }
    dragFrom = toPage(e); canvas.setPointerCapture(e.pointerId); e.preventDefault();
  });
  canvas.addEventListener('pointerup', () => {
    if (!dragFrom) return;
    dragFrom = null;
    if (!draft || draft.w < 16 || draft.h < 16) { draft = null; draw(); return; }
    const rect = draft;
    const nameIn = h('input', { class: 'inp', placeholder: 'Name of this section', style: { maxWidth: '260px' } });
    const save = () => {
      const name = nameIn.value.trim() || 'Section ' + ((APP.project.areas[U.page] || []).length + 1);
      (APP.project.areas[U.page] = APP.project.areas[U.page] || []).push({ id: 'c' + Date.now().toString(36), name, x: Math.round(rect.x), y: Math.round(rect.y), w: Math.round(rect.w), h: Math.round(rect.h) });
      draft = null; U.drawing = false; viewport.classList.remove('drawing'); projectChanged(); draw();
    };
    nameIn.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') save(); });
    areaBar.innerHTML = '';
    areaBar.append(nameIn, h('button', { class: 'btn sm primary', onclick: save }, 'Save section'), h('button', { class: 'btn sm', onclick: () => { draft = null; draw(); } }, 'Cancel'));
    nameIn.focus();
  });
  function hoverText(x, y) {
    if (U.layer === 'clicks' && U.dots) {
      let best = null, bd = 12 / Math.max(0.3, scale);
      for (const c of D.G.clicks) { const d = Math.hypot(c.x - x, c.y - y); if (d < bd) { bd = d; best = c; } }
      if (best) {
        const d = APP.store.elements[best.key];
        const flags = [(best.flags & 1) && (best.flags & 4) ? 'no response' : '', best.flags & 2 ? 'repeated clicking' : '', best.flags & 8 ? 'keyboard' : ''].filter(Boolean).join(', ');
        return `<b>${esc(ENG.elementName(d, APP.project.elementNames[best.key]))}</b><br>${esc(partLabel(best.part))} · ${fmt.n(best.rel / 1000, 1)} s after opening the page${flags ? '<br>' + esc(flags) : ''}`;
      }
    }
    const ai = areas.findIndex((a) => x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h);
    if ((U.layer === 'areas' || U.showAreas) && ai >= 0 && aStats[ai]) {
      const s = aStats[ai];
      return `<b>${esc(s.area.name)}</b><br>Reached by ${s.reached} of ${s.n} (${fmt.pct(s.pct)})<br>Median time in view ${fmt.s(s.vis)} s · cursor ${fmt.s(s.cursor)} s<br>${s.clicks} click${s.clicks === 1 ? '' : 's'}`;
    }
    if (U.layer === 'reach') {
      const r = D.reach.find((q) => q.y >= y);
      return r ? `<b>${fmt.pct(r.frac)}</b> of participants scrolled to ${fmt.n(y)} px` : '';
    }
    if (D.ref) {
      let best = null;
      for (const it of D.ref.items) {
        const [k, ix, iy, iw, ih, lb] = it;
        if (!lb || k === 'L' || k === 'P') continue;
        if (x >= ix && x <= ix + iw && y >= iy && y <= iy + ih && (!best || iw * ih < best[3] * best[4])) best = it;
      }
      if (best) {
        const [k, ix, iy, iw, ih, lb] = best;
        let sec = 0, clicks = 0;
        for (const m of D.G.moves) if (m.x >= ix && m.x <= ix + iw && m.y >= iy && m.y <= iy + ih) sec += m.w;
        for (const c of D.G.clicks) if (c.x >= ix && c.x <= ix + iw && c.y >= iy && c.y <= iy + ih) clicks++;
        const kind = { a: 'Link', b: 'Button', t: 'Tab', i: 'Field', s: 'Menu', c: 'Clickable card', k: 'Card', x: 'Option' }[k] || (k.charAt(0) === 'h' ? 'Heading' : 'Element');
        return `<b>${esc(kind)}: ${esc(APP.store.labels[lb] || '')}</b><br>Cursor ${fmt.n(sec, 1)} s · ${clicks} click${clicks === 1 ? '' : 's'}`;
      }
    }
    return `${fmt.n(x)} × ${fmt.n(y)} px`;
  }

  /* export */
  const resSeg = mkSeg([['std', 'Standard'], ['high', 'High resolution']], () => U.res, (k) => { U.res = k; }, 'Resolution');
  const layerName = { cursor: 'Cursor attention', clicks: 'Clicks', reach: 'Scroll reach', areas: 'Page sections' };
  exportRow.append(
    h('button', { class: 'btn primary', onclick: async () => {
      const s = U.res === 'high' ? (D.H > 5000 ? 1.5 : 2) : 1;
      const cv = HV.exportCanvas(M, { scale: s, title: `${layerName[U.layer]}: ${pageLabel(U.page)}`, subtitle: figureSubtitle(), note: noteText().slice(0, 220) });
      const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
      saveFile(`TIE ${layerName[U.layer]} - ${pageLabel(U.page).replace(/[^\w\- ]+/g, '').trim()}.png`, blob, 'image/png');
    } }, icon('save'), 'Save figure (PNG)'), resSeg,
    h('button', { class: 'btn', onclick: () => copyText(figureCaption()) }, icon('copy'), 'Copy caption'));
  function figureSubtitle() {
    const f = filt();
    const bits = [`${nParts} participant${nParts === 1 ? '' : 's'}`, `${nViews} page view${nViews === 1 ? '' : 's'}`];
    if (f.groups.length) bits.push(f.groups.map(groupName).join(', '));
    if (f.tasks.length) bits.push(f.tasks.map(taskLabel).join(', '));
    return bits.join(' · ');
  }
  function figureCaption() {
    const what = { cursor: 'Cursor attention', clicks: 'Clicks', reach: 'How far participants scrolled', areas: 'Page sections used as areas of interest' }[U.layer];
    let c = `${what} on the ${pageLabel(U.page)} page of ReMeDe (${figureSubtitle()}). `;
    if (U.layer === 'cursor') c += 'Warmer colours mark where the cursor rested longer. ';
    if (U.layer === 'clicks') c += 'Warmer colours mark more clicks; dots mark single clicks, red where the page did not respond. ';
    if (U.layer === 'reach') c += 'Shading darkens where fewer participants scrolled; lines mark where 75%, 50% and 25% of participants stopped. ';
    if (U.align && D.widths.length > 1) c += `Positions from screens ${D.widths[0]}–${D.widths[D.widths.length - 1]} px wide were aligned to a ${D.W} px reference layout using the page’s headings and controls.`;
    return c.trim();
  }

  requestAnimationFrame(draw);
  APP.redraw = draw;
}
async function setBackground(page, rec) {
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('Could not read that image.')); img.src = rec.src; });
  APP.bgImages[page] = Object.assign({}, rec, { img });
  await persistBackground(page);
}
async function persistBackground(page) {
  const b = APP.bgImages[page];
  if (!b) return;
  await idb.set('bg:' + page, { src: b.src, opacity: b.opacity, name: b.name });
}

/* ---- view-clicks.js ---- */
/* ============================ Clicks and feature use ============================ */
function pvAt(S, t) {
  let cur = null;
  for (const pv of S.pvs) { if (pv.t <= t) cur = pv; else break; }
  return cur || S.pvs[0] || null;
}
function featureOf(key) {
  const F = APP.project.elementFeature;
  if (F[key]) return F[key];
  const d = APP.store.elements[key];
  if (d) { const pk = 'pat:' + ENG.patternKey(d); if (F[pk]) return F[pk]; }
  return '';
}
function clickRows(page, merge) {
  const ck = ['clicks', filterKey(), page, merge, JSON.stringify(APP.project.elementNames)].join('|');
  if (APP.cache.has(ck)) return APP.cache.get(ck);
  const by = new Map(), partsAll = new Set();
  for (const S of sessionsSel()) {
    partsAll.add(S.part);
    for (const e of S.ev) {
      if (e[0] !== 'c') continue;
      const pv = pvAt(S, e[1]);
      const pkey = pv ? pageKeyOfPath(ENG.pagePath(pv)) : '';
      const pexact = pv ? 'p:' + ENG.pagePath(pv) : '';
      if (page !== 'all' && page !== pkey && page !== pexact) continue;
      const d = APP.store.elements[e[5]];
      const key = merge && d ? 'pat:' + ENG.patternKey(d) : e[5];
      let r = by.get(key);
      if (!r) {
        r = { key, elKey: e[5], desc: d, clicks: 0, parts: new Set(), first: new Map(), unresp: 0, rage: 0, pages: new Map(), labels: new Set(), groupsParts: {} };
        by.set(key, r);
      }
      r.clicks++;
      r.parts.add(S.part);
      (r.groupsParts[S.group || ''] = r.groupsParts[S.group || ''] || new Set()).add(S.part);
      const rel = (e[1] - S.start) / 1000;
      if (!r.first.has(S.part) || rel < r.first.get(S.part)) r.first.set(S.part, rel);
      const fl = e[6] || 0;
      if ((fl & 1) && (fl & 4)) r.unresp++;

/* ============================ Measures and tests ============================ */
const MDEF = Object.fromEntries(ENG.METRICS.map(([k, label, def]) => [k, { label, def }]));
function metricFmt(k, v) {
  if (v == null || !isFinite(v)) return '–';
  if (k === 'lostness') return fmt.n(v, 2);
  if (k === 'depth_pct') return fmt.n(v, 0) + '%';
  if (/_s$/.test(k)) return fmt.s(v);
  if (k === 'cursor_speed') return fmt.n(v, 0);
  return Number.isInteger(v) ? fmt.n(v) : fmt.n(v, 1);
}
function runTests() {
  const ck = 'tests|' + filterKey() + '|' + JSON.stringify(APP.project.testMetrics) + JSON.stringify(chosenOutcomes()) + JSON.stringify(APP.project.tasks) + APP.project.idleSec;
  if (APP.cache.has(ck)) return APP.cache.get(ck);
  const rows = metricRows(), gl = groupList().filter((g) => g.key !== ''), tl = taskList().filter((t) => rows.some((r) => r.task === t.key));
  const mets = APP.project.testMetrics.filter((k) => MDEF[k]);
  const out = { groupTests: [], taskTests: [], corr: [], desc: {}, descGroup: {}, groups: gl, tasks: tl, mets };
  // descriptives by task, and by task x group
  ENG.METRICS.forEach(([k]) => {
    out.desc[k] = {}; out.descGroup[k] = {};
    tl.forEach((t) => {
      const vals = rows.filter((r) => r.task === t.key).map((r) => r[k]).filter((v) => v != null && isFinite(v));
      out.desc[k][t.key] = ST.describe(vals);
      out.descGroup[k][t.key] = {};
      gl.forEach((g) => { out.descGroup[k][t.key][g.key] = ST.describe(rows.filter((r) => r.task === t.key && r.group === g.key).map((r) => r[k]).filter((v) => v != null && isFinite(v))); });
    });
  });
  // group differences, within each task
  if (gl.length >= 2) tl.forEach((t) => {
    const fam = [];
    mets.forEach((k) => {
      const samples = gl.map((g) => rows.filter((r) => r.task === t.key && r.group === g.key).map((r) => r[k]).filter((v) => v != null && isFinite(v)));
      const keep = gl.map((g, i) => ({ g, s: samples[i] })).filter((x) => x.s.length >= 2);
      if (keep.length < 2) return;
      const all = [].concat(...keep.map((x) => x.s));
      if (new Set(all).size < 2) return;
      let res;
      if (keep.length === 2) {
        const m = ST.mannWhitney(keep[0].s, keep[1].s);
        res = { metric: k, task: t.key, test: 'U', stat: m.U, z: m.z, p: m.p, eff: m.r, effName: 'r', exact: m.exact, groups: keep.map((x) => x.g.key), ns: keep.map((x) => x.s.length) };
      } else {
        const kw = ST.kruskal(keep.map((x) => x.s));
        res = { metric: k, task: t.key, test: 'H', stat: kw.H, df: kw.df, p: kw.p, eff: kw.eps2, effName: 'ε²', groups: keep.map((x) => x.g.key), ns: keep.map((x) => x.s.length),
          post: kw.pairs.map((pr) => ({ a: keep[pr.i].g.key, b: keep[pr.j].g.key, z: pr.z, p: pr.p, pAdj: pr.pAdj, higher: kw.meanRanks[pr.i] > kw.meanRanks[pr.j] ? keep[pr.i].g.key : keep[pr.j].g.key })) };
      }
      res.medians = Object.fromEntries(keep.map((x) => [x.g.key, ST.median(x.s)]));
      fam.push(res);
    });
    const adj = ST.holm(fam.map((x) => x.p));
    fam.forEach((x, i) => { x.pHolm = adj[i]; });
    out.groupTests.push(...fam);
  });
  // differences between tasks, within participants (complete cases)
  if (tl.length >= 2) {
    const fam = [];
    const byPart = new Map();
    rows.forEach((r) => { if (!byPart.has(r.part)) byPart.set(r.part, {}); byPart.get(r.part)[r.task] = r; });
    mets.forEach((k) => {
      const mat = [];
      byPart.forEach((o) => { const row = tl.map((t) => (o[t.key] ? o[t.key][k] : null)); if (row.every((v) => v != null && isFinite(v))) mat.push(row); });
      if (mat.length < 3) return;
      if (tl.length === 2) {
        const w = ST.wilcoxon(mat.map((r) => r[0]), mat.map((r) => r[1]));
        fam.push({ metric: k, test: 'W', stat: w.W, z: w.z, p: w.p, eff: w.r, effName: 'r', n: mat.length, method: w.method, medians: tl.map((t, j) => ST.median(mat.map((r) => r[j]))) });
      } else {
        const f = ST.friedman(mat);
        if (!f) return;
        const post = [];
        for (let i = 0; i < tl.length; i++) for (let j = i + 1; j < tl.length; j++) {
          const w = ST.wilcoxon(mat.map((r) => r[i]), mat.map((r) => r[j]));
          post.push({ a: tl[i].key, b: tl[j].key, W: w.W, z: w.z, p: w.p, r: w.r });
        }
        const pa = ST.holm(post.map((x) => x.p)); post.forEach((x, i) => { x.pAdj = pa[i]; });
        fam.push({ metric: k, test: 'F', stat: f.chi2, df: f.df, p: f.p, eff: f.W, effName: 'W', n: f.n, post, medians: tl.map((t, j) => ST.median(mat.map((r) => r[j]))) });
      }
    });
    const adj = ST.holm(fam.map((x) => x.p));
    fam.forEach((x, i) => { x.pHolm = adj[i]; });
    out.taskTests = fam;
  }
  // relations to questionnaire outcomes (participant level)
  const outs = chosenOutcomes();
  if (outs.length) {
    const prs = participantRows().filter((p) => p.vader);
    const fam = [];
    mets.forEach((k) => outs.forEach((o) => {
      const x = [], y = [];
      prs.forEach((p) => { const a = p[k], b = p.vader[o]; if (a != null && isFinite(a) && typeof b === 'number' && isFinite(b)) { x.push(a); y.push(b); } });
      if (x.length < 5) return;
      const s = ST.spearman(x, y);
      if (!s || !isFinite(s.rho)) return;
      fam.push({ metric: k, outcome: o, rho: s.rho, lo: s.ciLo, hi: s.ciHi, p: s.p, n: s.n });
    }));
    const adj = ST.holm(fam.map((x) => x.p));
    fam.forEach((x, i) => { x.pHolm = adj[i]; });
    out.corr = fam;
    out.nWithVader = prs.length;
  }
  APP.cache.set(ck, out);
  return out;
}
const sig = (p) => p != null && p < 0.05;
function statText(r) {
  if (r.test === 'H') return `H(${r.df}) = ${fmt.n(r.stat, 2)}`;
  if (r.test === 'U') return `U = ${fmt.n(r.stat, 1)}, z = ${fmt.r(r.z, 2)}`;
  if (r.test === 'F') return `χ²F(${r.df}) = ${fmt.n(r.stat, 2)}`;
  if (r.test === 'W') return `W = ${fmt.n(r.stat, 1)}, z = ${fmt.r(r.z, 2)}`;

}

  }));
  add('Descriptives', desc);
  const tests = [['family', 'measure', 'task / outcome', 'test', 'statistic', 'df', 'z', 'p', 'p_holm', 'effect', 'effect size', 'n', 'post hoc']];
  T.groupTests.forEach((r) => tests.push(['groups', MDEF[r.metric].label, r.task, r.test === 'H' ? 'Kruskal-Wallis H' : 'Mann-Whitney U', r.stat, r.df || '', r.z == null ? '' : r.z, r.p, r.pHolm, r.effName, r.eff, r.ns.join('/'),
    (r.post || []).map((q) => `${q.a}-${q.b}: z=${q.z.toFixed(2)}, p_holm=${q.pAdj.toFixed(4)}`).join('; ')]));
  T.taskTests.forEach((r) => tests.push(['tasks', MDEF[r.metric].label, T.tasks.map((t) => t.key).join('/'), r.test === 'F' ? 'Friedman' : 'Wilcoxon signed-rank', r.stat, r.df || '', r.z == null ? '' : r.z, r.p, r.pHolm, r.effName, r.eff, r.n,
    (r.post || []).map((q) => `${q.a}-${q.b}: W=${q.W}, p_holm=${q.pAdj.toFixed(4)}`).join('; ')]));

  add('Elements', [['element', 'page', 'region / section', 'clicks', 'participants', 'share', 'first click s (median)', 'unresponsive', 'feature']].concat(
    C.rows.sort((a, b) => b.clicks - a.clicks).map((r) => [r.name, pageLabel(r.page), r.where, r.clicks, r.n, r.pct, r.firstMed, r.unresp, r.feature])));

    FU.map((x) => [x.f.code, x.f.area, x.f.name, x.n, x.total, x.pct, x.clicks, ...T.groups.map((g) => (x.byG.find((q) => q.g === g.key) || {}).k || 0), ...T.groups.map((g) => (x.byG.find((q) => q.g === g.key) || {}).n || 0),
      x.test ? x.test.test : '', x.test && x.test.chi2 != null ? x.test.chi2 : '', x.test ? x.test.p : ''])));
  const ap = (APP.ui.areas && APP.ui.areas.page) || bestSectionPage(pageOptions());
  if (ap) {
    const S = sectionData(ap);
    add('Sections', [['page', 'section', 'code', 'reached', 'of', 'share', 'ci_low', 'ci_high', 'in view s (median)', 'cursor s (median)', 'clicks', 'first seen s (median)']].concat(
      S.stats.map((s) => [pageLabel(ap), s.area.name, APP.project.areaCodes[s.area.name] || '', s.reached, s.n, s.pct, s.ci[0], s.ci[1], s.vis, s.cursor, s.clicks, s.first])));
  }
  const pv = [['session', 'participant', 'group', 'task', 'page', 'path', 'opened (UTC)', 'seconds', 'screen width']];
  sessionsSel().forEach((S) => S.pvs.forEach((p) => pv.push([S.sid, partLabel(S.part), S.group, S.task, pageLabel(pageKeyOfPath(ENG.pagePath(p))), p.path, new Date(S.t0 + p.t).toISOString(), +((p.end - p.t) / 1000).toFixed(2), p.cw])));
  add('Page views', pv);
  add('Definitions', [['measure', 'name', 'definition']].concat(ENG.METRICS.map(([k, l, d]) => [k, l, d])).concat([[], ['setting', 'value'], ['idle threshold (s)', APP.project.idleSec],
    ['unresponsive click', 'no page change, focus change, address change or automatic scroll within 1 s and before the next press'], ['repeated-click burst', '3 or more clicks within 1 s and 30 px'],
    ['tasks', JSON.stringify(APP.project.tasks)], ['exported', new Date().toISOString()]]));
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  saveFile('TIE results.xlsx', new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}

/* ---- view-writeup.js ---- */
/* ============================ Write-up ============================ */
const I = (s) => `<i>${s}</i>`;
const P = (p) => (p < 0.001 ? `${I('p')} < .001` : `${I('p')} = ${p.toFixed(3).replace(/^0/, '')}`);
const PH = (p) => (p < 0.001 ? `${I('p')}<sub>Holm</sub> < .001` : `${I('p')}<sub>Holm</sub> = ${p.toFixed(3).replace(/^0/, '')}`);
const r2 = (v) => fmt.r(v, 2);
const plural = (n, a, b) => `${n} ${n === 1 ? a : b || a + 's'}`;
const listJoin = (a) => (a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]);
const words = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const num = (n) => (n >= 0 && n <= 10 ? words[n] : String(n));
const Num = (n) => { const s = num(n); return s.charAt(0).toUpperCase() + s.slice(1); };
const PROSE = { time_s: 'time on ReMeDe', active_s: 'active time', idle_s: 'idle time', pages: 'page views', unique_pages: 'the number of different pages',
  clicks: 'the number of clicks', clicks_controls: 'clicks on controls', unresponsive: 'unresponsive clicks', empty_clicks: 'clicks on non-clickable areas',
  rage_bursts: 'repeated-click bursts', cursor_px: 'cursor distance', cursor_speed: 'cursor speed', scroll_px: 'scroll distance', depth_pct: 'scroll depth',
  history_nav: 'use of back and forward', searches: 'searches', menu_changes: 'menu changes', copies: 'copying', errors: 'errors', first_click_s: 'time to first click',
  lostness: 'lostness', target_s: 'time to the target page', target_reached: 'reaching the target page' };
const prose = (k) => PROSE[k] || MDEF[k].label.toLowerCase();
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function quoteName(name) {
  const m = String(name).match(/^([A-Z][\w ]*?): (.+)$/);
  return m ? `the “${m[2]}” ${m[1].toLowerCase()}` : `“${name}”`;
}
function pageProse(key) {
  if (key.startsWith('p:')) {
    const path = key.slice(2);
    let best = null;
    for (const sn of Object.values(APP.store.snaps)) {
      if (sn.path.split('?')[0] !== path) continue;
      const h1 = sn.items.find((it) => it[0] === 'h1' && it[5]);
      if (h1) { best = APP.store.labels[h1[5]]; break; }
    }
    if (APP.project.pageNames[key]) return APP.project.pageNames[key];
    if (best) return best;
    return pageLabel(key).replace(/ \(\/.*\)$/, '');
  }
  return pageLabel(key);
}

function buildWriteup() {
  const S = sessionsSel(), rows = metricRows(), T = runTests(), gl = T.groups, tl = T.tasks;
  const parts = new Set(rows.map((r) => r.part));
  const out = { method: [], results: [], captions: [], findings: [] };
  if (!rows.length) return out;
  const tests = APP.sessions.filter((x) => x.ctx.test).length;
  const excluded = Object.keys(APP.project.exclude).length;
  const searchText = S.some((x) => x.ev.some((e) => e[0] === 'k' && typeof e[5] === 'string'));
  const matches = S.reduce((m, x) => { m[x.match] = (m[x.match] || 0) + 1; return m; }, {});
  const widths = S.map((x) => x.cw).filter((w) => w > 0);
  const tName = (k) => { const n = APP.project.taskNames[k]; return n ? (/task$/i.test(n) ? `the ${n}` : `the ${n} task`) : `task ${k}`; };
  const TName = (k) => { const s = tName(k); return s.charAt(0).toUpperCase() + s.slice(1); };

  /* ---------- method ---------- */
  let m = 'Interaction with ReMeDe was recorded with TIE, a logging add-on developed for this study. Participants opened ReMeDe through a study address that relayed the live site unchanged and added a recording script on the way to the browser; ReMeDe’s own code and hosting were not modified. ';
  m += 'For each task the script recorded cursor positions (sampled at most every 50 ms while the cursor moved), clicks together with the element clicked, scrolling, page views and an outline of each page’s layout. ';
  m += searchText ? 'Apart from the words typed into search boxes, no typed text was recorded. ' : 'No typed text was recorded. ';
  m += (matches.time || matches.manual)
    ? 'Records were linked to the questionnaire responses in VaDeR through the participant code added to each task’s address and, where it was missing, by matching session times. '
    : 'Records were linked to the questionnaire responses in VaDeR through the participant code added to each task’s address. ';
  if (tests || excluded) m += `${tests ? plural(tests, 'test session') + ' run by the researcher ' + (tests === 1 ? 'was' : 'were') + ' excluded' : ''}${tests && excluded ? ', as ' + (excluded === 1 ? 'was one participant' : 'were ' + excluded + ' participants') : (!tests && excluded ? Num(excluded) + ' ' + (excluded === 1 ? 'participant was' : 'participants were') + ' excluded' : '')}. `;
  out.method.push(m.trim());
  let m2 = `Active time counted the intervals between successive inputs of up to ${APP.project.idleSec} s. A click on a control was counted as unresponsive when nothing on the page changed, focus did not move and the address did not change within 1 s and before the next click; a burst of repeated clicks was three or more clicks within 1 s and 30 px. `;
  const lostTasks = tl.filter((t) => (APP.project.tasks[t.key] || {}).minPages);
  if (lostTasks.length) m2 += `Lostness was computed following Smith (1996), with the minimum number of pages set to ${listJoin(lostTasks.map((t) => `${APP.project.tasks[t.key].minPages} for ${tName(t.key)}`))}. `;
  m2 += 'Because participants used different screens, cursor and click positions were aligned to a common reference layout for each page through the headings and controls recorded with every page view. Measures were compared with non-parametric tests (Kruskal–Wallis or Mann–Whitney between groups, Friedman or Wilcoxon between tasks, Spearman correlations with questionnaire scores), with Holm’s correction within each family of tests.';
  out.method.push(m2);

  /* ---------- results: data ---------- */
  const gCounts = gl.map((g) => `${g.short} = ${new Set(rows.filter((r) => r.group === g.key).map((r) => r.part)).size}`);
  let d0 = `Interaction records were available for ${parts.size} participants${gl.length > 1 ? ' (' + gCounts.join(', ') + ')' : ''}, covering ${rows.length} participant–task sessions.`;
  if (widths.length) {
    const w = widths.slice().sort((a, b) => a - b);
    d0 += ` Their browser windows were ${w[0]}–${w[w.length - 1]} px wide (${I('Mdn')} = ${fmt.n(ST.median(w))} px).`;
  }
  out.results.push({ h: 'Interaction data', html: d0 });

  /* ---------- results: effort per task ---------- */
  const eff = [];
  tl.forEach((t) => {
    const d = (k) => T.desc[k][t.key];
    if (!d('time_s').n) return;
    const iqr = (k) => `IQR ${metricFmt(k, d(k).q1)}–${metricFmt(k, d(k).q3)}`;
    let s = `In ${tName(t.key)}, participants spent a median of ${metricFmt('time_s', d('time_s').median)} s on ReMeDe (${iqr('time_s')} s), ${metricFmt('active_s', d('active_s').median)} s of it active; they opened a median of ${metricFmt('pages', d('pages').median)} pages (${iqr('pages')}) and clicked ${metricFmt('clicks', d('clicks').median)} times (${iqr('clicks')}).`;
    if (d('lostness').n) s += ` Median lostness was ${metricFmt('lostness', d('lostness').median)} (${iqr('lostness')}).`;
    if (d('target_reached').n) {
      const tr = rows.filter((r) => r.task === t.key && r.target_reached != null);
      const k = tr.filter((r) => r.target_reached === 1).length;
      const after = d('target_s').n ? `, after a median of ${metricFmt('target_s', d('target_s').median)} s` : '';
      s += k === tr.length ? ` All ${tr.length} participants opened the target page${after}.` : ` Of the ${tr.length} participants, ${k} (${fmt.pct(k / tr.length)}) opened the target page${after}.`;
    }
    eff.push(s);
    out.findings.push(`${cap(APP.project.taskNames[t.key] || t.key)}: median ${metricFmt('time_s', d('time_s').median)} s on ReMeDe, ${metricFmt('pages', d('pages').median)} pages, ${metricFmt('clicks', d('clicks').median)} clicks.`);
  });
  if (eff.length) out.results.push({ h: 'Effort and navigation', html: eff.join(' ') });

  /* ---------- results: groups ---------- */
  if (gl.length > 1 && T.groupTests.length) {
    const sigs = T.groupTests.filter((r) => r.pHolm < 0.05);
    let s = '';
    sigs.forEach((r) => {
      const stat = r.test === 'H' ? `${I('H')}(${r.df}) = ${fmt.n(r.stat, 2)}, ${P(r.p)}, ${PH(r.pHolm)}, ${I('ε')}² = ${r2(r.eff)}` : `${I('U')} = ${fmt.n(r.stat, 1)}, ${I('z')} = ${fmt.r(r.z, 2)}, ${P(r.p)}, ${PH(r.pHolm)}, ${I('r')} = ${r2(r.eff)}`;
      const meds = gl.filter((g) => r.medians[g.key] != null).map((g) => `${g.short} ${metricFmt(r.metric, r.medians[g.key])}`).join(', ');
      s += `${cap(prose(r.metric))} in ${tName(r.task)} differed between groups (medians ${meds}), ${stat}`;
      const ph = (r.post || []).filter((q) => q.pAdj < 0.05);
      if (ph.length) s += `; Dunn’s post hoc tests showed higher values for ${listJoin(ph.map((q) => `${q.higher} than ${q.higher === q.a ? q.b : q.a} (${PH(q.pAdj)})`))}`;
      s += '. ';
      out.findings.push(`Groups differed in ${prose(r.metric)} in ${tName(r.task)} (p_Holm ${fmt.p(r.pHolm)}).`);
    });
    const nsN = T.groupTests.length - sigs.length;
    if (nsN) s += sigs.length ? `The groups did not differ on the other ${plural(nsN, 'comparison')} after correction (all ${I('p')}<sub>Holm</sub> ≥ .05).` :
      `The groups did not differ significantly on any measure in any task after correction (all ${I('p')}<sub>Holm</sub> ≥ .05; ${plural(T.groupTests.length, 'comparison')}).`;
    out.results.push({ h: 'Differences between groups', html: s.trim() });
  }

  /* ---------- results: tasks ---------- */
  if (T.taskTests.length) {
    const sigs = T.taskTests.filter((r) => r.pHolm < 0.05);
    let s = '';
    sigs.forEach((r) => {
      const stat = r.test === 'F' ? `${I('χ')}²<sub>F</sub>(${r.df}) = ${fmt.n(r.stat, 2)}, ${P(r.p)}, ${PH(r.pHolm)}, ${I('W')} = ${r2(r.eff)}` : `${I('W')} = ${fmt.n(r.stat, 1)}, ${I('z')} = ${fmt.r(r.z, 2)}, ${P(r.p)}, ${PH(r.pHolm)}, ${I('r')} = ${r2(r.eff)}`;
      s += `${cap(prose(r.metric))} differed between tasks (medians ${tl.map((t, j) => `${t.key} ${metricFmt(r.metric, r.medians[j])}`).join(', ')}), ${stat}, ${I('n')} = ${r.n}. `;
    });
    const ns = T.taskTests.length - sigs.length;
    if (ns) s += sigs.length ? `Other measures did not differ between tasks after correction.` : `No measure differed significantly between tasks after correction (all ${I('p')}<sub>Holm</sub> ≥ .05).`;
    out.results.push({ h: 'Differences between tasks', html: s.trim() });
  }

  /* ---------- results: problems ---------- */
  {
    const withUn = new Set(rows.filter((r) => r.unresponsive > 0).map((r) => r.part));
    const withRage = new Set(rows.filter((r) => r.rage_bursts > 0).map((r) => r.part));
    const C = clickRows('all', false).rows.filter((r) => r.unresp > 0).sort((a, b) => b.unresp - a.unresp);
    const errs = errorRows();
    let s = withUn.size ? `Of the ${parts.size} participants, ${withUn.size} (${fmt.pct(withUn.size / parts.size)}) made at least one unresponsive click` : 'No participant made an unresponsive click';
    if (C.length) s += `; the control affected most often was ${quoteName(C[0].name)} (${plural(C[0].unresp, 'click')} by ${plural(C[0].n, 'participant')})`;
    s += '. ';
    if (withRage.size) s += `Repeated clicking in one spot occurred for ${plural(withRage.size, 'participant')}. `;
    s += errs.length ? `ReMeDe raised ${plural(errs.reduce((a, r) => a + r.n, 0), 'error')} during the tasks, affecting ${plural(new Set(errs.flatMap((r) => [...r.parts])).size, 'participant')}; the most frequent was “${esc(errs[0].msg.slice(0, 90))}”.` : 'No script or loading errors were recorded.';
    out.results.push({ h: 'Interaction problems', html: s });
    out.findings.push(withUn.size ? `${withUn.size} of ${parts.size} participants made an unresponsive click${C.length ? ', most often on ' + quoteName(C[0].name) : ''}.` : 'No unresponsive clicks.');
  }

  /* ---------- results: features ---------- */
  const FU = featureUse().filter((x) => x.mapped);
  if (FU.length) {
    const used = FU.filter((x) => x.n > 0).sort((a, b) => b.pct - a.pct);
    let s = used.length ? `The features used by most participants were ${listJoin(used.slice(0, 3).map((x) => `${x.f.code} ${x.f.name} (${fmt.pct(x.pct)})`))}.` : '';
    const unused = FU.filter((x) => x.n === 0);
    if (unused.length) s += ` ${listJoin(unused.slice(0, 4).map((x) => x.f.code + ' ' + x.f.name))} ${unused.length === 1 ? 'was' : 'were'} not used by any participant.`;
    const diff = used.filter((x) => x.test && x.test.p < 0.05);
    diff.forEach((x) => { s += ` Use of ${x.f.code} differed by group (${x.byG.map((g) => `${g.g} ${g.k}/${g.n}`).join(', ')}; ${x.test.test === "Fisher's exact" ? 'Fisher’s exact test, ' + P(x.test.p) : `${I('χ')}²(${x.test.df}) = ${fmt.n(x.test.chi2, 2)}, ${P(x.test.p)}, Cramér’s ${I('V')} = ${r2(x.test.V)}`}).`; });
    out.results.push({ h: 'Feature use', html: s.trim() });
  }

  /* ---------- results: page sections ---------- */
  const ap = (APP.ui.areas && APP.ui.areas.page) || bestSectionPage(pageOptions());
  if (ap) {
    const SD = sectionData(ap);
    if (SD.stats.length >= 3) {
      const st = SD.stats, n = st[0].n;
      const all = st.filter((s) => s.reached === n);
      const fewer = st.filter((s) => s.reached < n);
      let s = `On the ${pageProse(ap)} page (${I('n')} = ${n}), `;
      s += all.length === st.length ? 'every participant brought every section into view.' : `${all.length ? `every participant brought ${all.length === 1 ? 'the first section' : 'the first ' + num(all.length) + ' sections'} into view, while ` : ''}fewer reached ${listJoin(fewer.slice(-3).map((x) => `${x.area.name} (${x.reached}/${n}, ${fmt.pct(x.pct)})`))}.`;
      const byVis = st.slice().sort((a, b) => (b.vis || 0) - (a.vis || 0));
      s += ` The sections kept on screen longest were ${listJoin(byVis.slice(0, 2).map((x) => `${x.area.name} (${I('Mdn')} = ${fmt.s(x.vis)} s)`))}`;
      const byCur = st.slice().sort((a, b) => (b.cursorTotal || 0) - (a.cursorTotal || 0));
      s += `, and the cursor rested longest over ${byCur[0].area.name}.`;
      out.results.push({ h: 'Attention across page sections', html: s });
      out.findings.push(`${pageProse(ap)} page: ${fewer.length ? fewer[fewer.length - 1].area.name + ' reached by ' + fmt.pct(fewer[fewer.length - 1].pct) : 'every section reached by everyone'}; longest in view: ${byVis[0].area.name}.`);
      out.captions.push(`Figure X. Cursor attention on the ${pageProse(ap)} page of ReMeDe (${I('n')} = ${n} participants). Warmer colours mark where the cursor rested longer; positions from different screen sizes were aligned to a ${SD.D.W} px reference layout.`);
      out.captions.push(`Figure X. Share of participants who brought each section of the ${pageProse(ap)} page into view, with 95% Wilson confidence intervals (${I('n')} = ${n}).`);
    }
  }
  const home = pageOptions().filter((o) => !o.group).sort((a, b) => b.views - a.views)[0];
  if (home) out.captions.push(`Figure X. Clicks on the ${pageProse(home.key)} page of ReMeDe (${plural(home.parts, 'participant')}, ${home.views} page views). Dots mark single clicks; red dots mark clicks after which the page did not respond.`);

  /* ---------- results: questionnaires ---------- */
  if (T.corr.length) {
    const sigs = T.corr.filter((r) => r.pHolm < 0.05).sort((a, b) => a.pHolm - b.pHolm);
    let s = '';
    if (sigs.length) {
      s = sigs.slice(0, 4).map((r) => `${cap(prose(r.metric))} correlated with ${r.outcome}, ${I('ρ')} = ${r2(r.rho)}, 95% CI [${r2(r.lo)}, ${r2(r.hi)}], ${P(r.p)}, ${PH(r.pHolm)}, ${I('n')} = ${r.n}`).join('; ') + '.';
      if (sigs.length > 4) s += ` ${Num(sigs.length - 4)} further correlations were significant after correction (see the results table).`;
      sigs.slice(0, 3).forEach((r) => out.findings.push(`${cap(prose(r.metric))} and ${r.outcome}: ρ = ${r2(r.rho)} (p_Holm ${fmt.p(r.pHolm)}).`));
    } else {
      const top = T.corr.slice().sort((a, b) => Math.abs(b.rho) - Math.abs(a.rho))[0];
      s = `No interaction measure was significantly related to the questionnaire scores after Holm correction (${plural(T.corr.length, 'correlation')}); the strongest association was between ${prose(top.metric)} and ${top.outcome}, ${I('ρ')} = ${r2(top.rho)}, ${P(top.p)}.`;
    }
    out.results.push({ h: 'Relation to questionnaire scores', html: s });
  }
  return out;
}
